[project]
name = "miminet-back"
version = "0.1.0"
description = "Miminet back-end Celery worker."
requires-python = ">=3.10,<3.12"
dependencies = [
    "celery==5.5.3",
    "dpkt==1.9.8",
    "ipmininet @ git+https://github.com/mimi-net/ipmininet.git@1.2.4",
    "marshmallow_dataclass==8.7.1",
    "netaddr==1.3.0",
    "psutil==7.0.0",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.uv]
package = false
